<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEXORA</title><script src="https://telegram.org/js/telegram-web-app.js"></script><link rel="stylesheet" href="/static/style.css"></head>
<body><header><div class="brand">NEXORA <span>RICH MESSAGE</span></div><div id="who">Memuat...</div></header><main>
<section class="panel"><h2>Buat Rich Message</h2><label>Judul draft</label><input id="title" placeholder="Nama draft"><label>Isi pesan (HTML Telegram)</label><textarea id="message" rows="5" placeholder="Tulis pesan di sini..."></textarea><div class="grid"><div><label>Jenis media</label><select id="mediaType"><option value="">Tanpa media</option><option value="photo">Foto</option><option value="video">Video</option></select></div><div><label>Telegram file_id</label><input id="fileId" placeholder="Opsional"></div></div><label>Tujuan posting</label><select id="destination"><option value="">Pilih tujuan</option></select><label>Jadwal (opsional)</label><input id="scheduled" type="datetime-local"><label>Tombol URL (JSON opsional)</label><textarea id="buttons" rows="3" placeholder='[[{"text":"Buka","url":"https://example.com"}]]'></textarea><small>Format: array baris tombol, setiap tombol memiliki text dan url.</small><button id="save">Simpan Draft</button><button id="publish" class="secondary">Posting Sekarang</button><p id="notice"></p></section>
<section class="panel"><div class="section-head"><h2>Draft Tersimpan</h2><button class="small" id="refresh">Muat Ulang</button></div><div id="drafts">Belum ada draft.</div></section>
<section class="panel"><div class="section-head"><h2>Tujuan</h2></div><input id="destTitle" placeholder="Nama channel/grup"><input id="destChat" placeholder="Chat ID, contoh -1001234567890"><button id="addDest" class="secondary">Tambah Tujuan</button></section>
<section class="panel"><h2>Riwayat Posting</h2><div id="history">Belum ada riwayat.</div></section>
</main><script src="/static/app.js"></script></body></html>
